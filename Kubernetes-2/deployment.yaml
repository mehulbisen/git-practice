---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: abc-deployment
  labels:
    abc: deployment 
spec:
  replicas: 3
  selector:  
    matchLabels:
      abc: deployment 
  template:
    metadata:
      labels: 
        abc: deployment 
    spec: 
      containers:
        - name: my-pod
          image: nginx
          ports:
            - containerPort: 8080
...

---
apiVersion: v1 
kind: Service 
metadata: 
  name: abc-service
  labels: 
    abc-deployment 
spec: 
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP 
  type: NodePort
  
  selector:
    abc: deployment 

        
      
    
