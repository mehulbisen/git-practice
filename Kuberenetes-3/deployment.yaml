---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-deployment
  lables:
    app: dev
spec:
  replicas: 3
  selectors:
    labels: 
      app: dev
  template: 
    metadata:
      name: my-pod
      labels:
        app: dev
    specs:
      containers:
        - name: my-pod
          image: httpd
          ports:
            - containerPort: 80
      
...
---

apiVersion: v1 
kind: Service
metadata:
  name: my-svc
  labels: 
    app: dev
spec:
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  type: NodePort
  selector:
    labels:
      app: dev

...