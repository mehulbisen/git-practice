---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: school-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: nginx:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: frontend-config
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
        - name: frontend-config
          mountPath: /etc/nginx/conf.d/default.conf   # 👈 overwrite default nginx.conf
          subPath: nginx.conf
      volumes:
      - name: frontend-config
        configMap:
          name: frontend-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: school-app
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
