---
apiVersion: apps/v1
kind: Deployment
metadata: 
  name: my-deployment
  labels:
    app: demo-app
    env: dev
spec:
  template:
    metadata:
      labels:
        app: my-app
        env: dev
    spec:
      containers:
        - name: my-container
          image: nginx
          ports:
            - containerPort: 8080
  replicas: 3
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: my-app
...

apiVersion: v1
kind: Service
metadata:
  name: myservice
  labels:
    app: my-app
    env: dev
spec:
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  
  type: NodePort
  selector:
    app: my-app
...

