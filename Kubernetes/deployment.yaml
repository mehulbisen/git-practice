---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-dep
  labels:
    dep: test

spec:
  replicas: 4

  selector:
    matchLabels:
      dep: test
  
  template:
    metadata:
      labels: 
        dep: test

    spec:
      containers:
        - name: test-dep
          image: httpd
          ports:
            - containerPort: 80
...
---
apiVersion: v1 
kind: Service 
metadata:
  name: test-svc
  labels:
    dep: test
spec:
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  type: NodePort 
  selector:
    dep: test 

... 