---
apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: abc-deployment
  labels: 
    abc: dep 

spec: 
  replicas: 3
  selector: 
    matchLabels: 
      abc: dep 

  template:
    metadata:
      matchLabels:
        abc: dep 
    spec: 
      containers: 
        - name: abc 
          image: httpd 
          ports:
            - containerPort: 80
...

---
apiVersion: v1 
kind: Service 
metadata:
  name: abc-svc
  labels:
    abc: dep 
spec: 
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP 
  type: NodePort 
  selector:
    abc: dep 
...