---
apiVersion: apps/v1
kind: Deployment
metadata: 
  name: test-deployment
  labels:
    app: test

spec: 
  replicas: 3

  selector:
    matchLabels:
      app: test
  template:
    metadata:
      labels:
        app: test

    spec:
      containers:
        - name: test
          image: httpd
          ports:
            - containerPort: 80
...

---

apiVersion: v1 
kind: Service
metadata:
  name: test-service
  labels:
    app: test-service

spec:
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  type: NodePort
  selector:
    app: test-service

...
