apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: sam-deployment
  labels: 
    sam: dep 
spec: 
  replicas: 3
  selector: 
    matchLabels: 
      sam: dep 
  
  template: 
    metadata: 
      labels:
        sam: dep 
    spec: 
      containers: 
        - name: sam-test
          image: httpd
          ports:  
            containerPort: 80
...

---

apiVersion: v1 
kind: Service 
metadata:
  name: sam-svc 
  labels:
    sam: dep  

spec: 
  ports: 
    - port: 80
      targetPort: 80
      protocol: TCP 
  type: NodePort 

  selector:
    sam: dep 
...