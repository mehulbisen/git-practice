--- 
apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: xyz-deployment 
  labels: 
    xyz: dep 
spec: 
  replicas: 3
  selector: 
    matchLabels: 
      xyz: dep 
  template:
    metadata: 
      labels: 
        xyz: dep 
    spec:
      containers:
        - name: xyz-pod 
          image: httpd
          ports: 
            containerPort: 80 

... 
--- 
apiVersion: v1 
kind: Service 
metadata: 
  name: xyz-servce
  labels: 
    xyz: dep 
spec: 
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP 

  type: NodePort 
  selector: 
    xyz: dep 
... 
  
