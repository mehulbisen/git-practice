---
apiVersion: apps/v1
kind: Deployment 
metadata: 
  name: mehul-dep
  labels:
    mehul: dep 

spec:
  replicas: 3
  selector: 
    matchLabels: 
      mehul: dep 
  
  template: 
    metadata: 
      labels: 
        mehul: dep 
    
    spec: 
      containers:
        - name: mehul-tests
          image: httpd
          ports:
            - containerPort: 80

...

---
apiVersion: v1 
kind: Service 
metadata: 
  name: mehul-svc
  labels:
    mehul: dep 
spec:
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP 
  type: NodePort 
  selector:
    mehul: dep 
...


