---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mobile-deployment
  labels:
    app: ecommerce
spec:
  replicas: 3
  selector: 
    matchLabels:
      app: ecommerce
  template:
    metadata: 
      name: mobile-container
      labels:
        app: ecommerce
    spec:
      containers:
        - name: mobile-server
          image: httpd
          ports:
            - containerPort: 80
  strategy:
    type: RollingUpdate
...

---
apiVersion: v1
kind: Service
metadata: 
  name: mobile-service
  labels:
    app: ecommerce
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app: ecommerce
...