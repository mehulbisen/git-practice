---
apiVersion: apps/v1
kind: Deployment
metadata: 
  name: web-app-dep
  labels: 
    app: webapp  
spec: 
  replicas: 3
  selector:
    matchLabels:
      app: webapp

  template: 
    metadata:
      labels: 
        app: webapp 
    
    spec:
      containers:
        - name: web-app 
          image: mehulbisen/web-app:v1
          ports:
            - containerPort: 8080
...

---
apiVersion: v1 
kind: Service 
metadata: 
  name: web-app-svc
  labels: 
    app: webapp 
spec:
  ports:
    - port: 80
      targetPort: 8080
  type: LoadBalancer
  selector:
    app: webapp 
...
